name: Labs Build and Publish

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: labs-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --force

      - name: Check changed frontend formatting
        run: >-
          npx prettier --check
          src/lib/utils/labTheme.ts
          src/lib/components/chat/LabWelcome.svelte
          src/lib/components/chat/ChatPlaceholder.svelte
          src/lib/components/chat/Placeholder.svelte
          src/lib/components/chat/Settings/Interface.svelte
          src/lib/components/admin/Settings/Interface.svelte
          src/lib/components/admin/Users/UserList/EditUserModal.svelte
          src/lib/components/layout/Sidebar.svelte
          src/routes/+layout.svelte
          src/routes/auth/+page.svelte
          src/lib/apis/configs/index.ts
          src/lib/apis/users/index.ts
          src/lib/stores/index.ts
          src/app.css
          docs/LAB_PROFILES.md
          config/labs.json
          docker-compose.lab.yaml

      - name: Validate backend syntax and sample configuration
        run: |
          python -m py_compile \
            backend/open_webui/config.py \
            backend/open_webui/main.py \
            backend/open_webui/models/users.py \
            backend/open_webui/routers/configs.py \
            backend/open_webui/routers/users.py
          python -m json.tool config/labs.json >/dev/null

      - name: Build production frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  docker:
    name: Build and publish container
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Prepare CI Dockerfile
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=8192\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}
