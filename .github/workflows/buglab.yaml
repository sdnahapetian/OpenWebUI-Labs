name: Bug Lab image (build & publish)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: buglab-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sdnahapetian/open-webui

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare CI Dockerfile (raise node heap)
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, Bug Lab variant)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sdnahapetian/open-webui:buglab
            ghcr.io/sdnahapetian/open-webui:git-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/sdnahapetian/open-webui:cache-buglab-amd64
          cache-to: type=registry,ref=ghcr.io/sdnahapetian/open-webui:cache-buglab-amd64,mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}
            USE_CUDA=false